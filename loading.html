<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="fonts.css" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://suis.sabanciuniv.edu 'unsafe-inline';">
    <style>
        body {
            margin: 0;
            background-color: white;
            user-select: none;
        }

        body>div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s;
            overflow: hidden;
        }
        * {
            font-family:Nexa,Roboto,Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
            line-height: 1.2;
            margin: 0;
        }
        #loadingbg {
            position: absolute;
            top: 0;
            left: 0;
            max-width: 100vw;
            max-height: 100vh;
            height: 100vh;
            width: 100vw;
            opacity: 0.1;
            --size: 50px;
            --time: 10s;
            --angle: 30deg;
            --uptime: 4s;
        }
        #loadingbg > div {
            background-image: url("loadingbg.svg");
            background-size: var(--size);
            background-position: center;
            background-repeat: repeat;
            min-height: var(--size);
            width: calc(100% + (100% * cos(var(--angle))));
        }
        #loadingbg > div:nth-child(odd) {
            animation: bgscrollleft var(--time) linear infinite, bgscrollup var(--uptime) linear infinite;
        }
        #loadingbg > div:nth-child(even) {
            animation: bgscrollright var(--time) linear infinite, bgscrollup var(--uptime) linear infinite;
        }
        @keyframes bgscrollleft {
            0% {
                background-position: 0px center;
            }
            100% {
                background-position: var(--size) center;
            }
        }
        @keyframes bgscrollright {
            0% {
                background-position: var(--size) center;
            }
            100% {
                background-position: 0px center;
            }
        }
        @keyframes bgscrollup {
            0% {
                transform: rotate(var(--angle)) translateY(0px);
            }
            100% {
                transform: rotate(var(--angle)) translateY(calc(var(--size) * -2 * (cos(var(--angle)))));
            }
        }
    </style>
</head>

<body>
    <div id="loadingbg">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
    <div id="genericloading">
        <h1>Loading...</h1>
    </div>
    <div id="loginloading" style="opacity: 0;flex-direction: row;gap: 20px;justify-content: flex-start;padding: 0px 40px;width: calc(100vw - 80px);">
        <div style="width: 100px;height: 100px;border: 10px solid #ccc;border-radius: 50%;background-size: cover;background-position: top center;"></div>
        <div style="display: flex;flex-direction: column;align-items: flex-start;justify-content: center; text-align: left;">
            <h4>Welcome back</h4>
            <h1>User</h1>
            <span>Grabbing your courses...</span>
        </div>
    </div>
    <div id="scraperloading" style="opacity: 0;">
        <h1>Scraping...</h1>
        <span>Starting...</span>
        <div style="position:absolute; bottom: 0px; left: 0px; width: 0%; height: 15px; background-color: #007bff;"></div>
    </div>
    <script>
        const genericLoading = document.getElementById("genericloading");
        const loginLoading = document.getElementById("loginloading");
        const scraperLoading = document.getElementById("scraperloading");

        window.suDesktop.onMessageFromMain("login-information", (data) => {
            genericLoading.style.opacity = 0;
            loginLoading.style.opacity = 1;
            console.log(data);
            if (data.user) {
                if (data.user.name) loginLoading.querySelector("h1").textContent = data.user.name;
                if (data.user.image) loginLoading.querySelector("div").style.backgroundImage = `url(${data.user.image})`;
            }
            loginLoading.querySelector("span").textContent = data.process;
        });

        window.suDesktop.onMessageFromMain("scraper-information", (data) => {
            genericLoading.style.opacity = 0;
            scraperLoading.style.opacity = 1;
            if (data.h) scraperLoading.querySelector("h1").textContent = data.h;
            if (data.t) scraperLoading.querySelector("span").textContent = data.t;
            if (data.p !== undefined) scraperLoading.querySelector("div").style.width = (data.p*100) + "%";
        });
    </script>
</body>

</html>
